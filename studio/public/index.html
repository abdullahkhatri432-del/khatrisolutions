<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Studio Desk · Khatri Solutions</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the lead workspace</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">KS</span>
        <span class="brand__text">
          <strong>Studio Desk</strong>
          <span>Lead proposals · Khatri Solutions</span>
        </span>
      </div>

      <div class="topbar__right">
        <div class="status-chips" id="status-chips" aria-label="Studio Desk status"></div>
        <button class="btn btn--ghost btn--small" type="button" data-action="settings">Setup</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Lead inbox">
        <div class="sidebar__head">
          <div class="sidebar__title">
            <span>Lead inbox</span>
            <span class="count" id="lead-count">0</span>
          </div>
          <div class="sidebar__actions">
            <button class="btn btn--primary btn--small" type="button" data-action="sync" id="sync-button">
              Pull leads
            </button>
            <button class="btn btn--ghost btn--small" type="button" data-action="import">Import CSV</button>
            <button class="btn btn--ghost btn--small" type="button" data-action="add">Add lead</button>
          </div>
          <label class="search">
            <span class="visually-hidden">Search leads</span>
            <input id="lead-search" type="search" placeholder="Search name, business, brief…" autocomplete="off" />
          </label>
          <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
        </div>
        <div class="lead-list" id="lead-list" aria-live="polite"></div>
      </aside>

      <main id="main" tabindex="-1">
        <div id="detail"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="lead-dialog" aria-labelledby="lead-dialog-title">
      <form method="dialog" class="dialog__head">
        <div>
          <p class="eyebrow">Manual entry</p>
          <h2 id="lead-dialog-title">Add a lead</h2>
        </div>
        <button class="icon-button" type="submit" value="cancel" aria-label="Close">×</button>
      </form>

      <form id="lead-form" class="dialog__body">
        <p class="muted">
          Email and phone stay in this local file. Only the brief is sent to OpenRouter when a draft is generated.
        </p>

        <div class="form-grid">
          <label class="field">
            <span>Name <em>required</em></span>
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label class="field">
            <span>Business</span>
            <input name="business" type="text" autocomplete="organization" />
          </label>
          <label class="field">
            <span>Business type</span>
            <input name="businessType" type="text" placeholder="Clinic, restaurant, D2C brand…" />
          </label>
          <label class="field">
            <span>Service</span>
            <input name="service" type="text" list="service-options" placeholder="Business Website" />
          </label>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" />
          </label>
          <label class="field">
            <span>Phone / WhatsApp</span>
            <input name="phone" type="tel" autocomplete="tel" />
          </label>
          <label class="field">
            <span>Budget</span>
            <input name="budget" type="text" placeholder="₹15,000 – ₹30,000" />
          </label>
          <label class="field">
            <span>Timeline</span>
            <input name="timeline" type="text" placeholder="Within a month" />
          </label>
          <label class="field field--full">
            <span>Project description <em>required, 20+ characters</em></span>
            <textarea name="description" rows="5" required placeholder="What do they need, who is it for, and what is not working today?"></textarea>
          </label>
        </div>

        <label class="checkbox">
          <input name="draftNow" type="checkbox" checked />
          <span>Generate the proposal draft immediately after adding</span>
        </label>

        <p class="form-error" id="lead-form-error" role="alert" hidden></p>

        <div class="dialog__actions">
          <button class="btn btn--ghost" type="button" data-action="close-lead">Cancel</button>
          <button class="btn btn--primary" type="submit">Add lead</button>
        </div>
      </form>

      <datalist id="service-options">
        <option value="Starter Website"></option>
        <option value="Business Website"></option>
        <option value="Business Plus Website"></option>
        <option value="E-commerce / Online Store"></option>
        <option value="Custom Web Application"></option>
        <option value="AI &amp; Business Automation"></option>
      </datalist>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog__head">
        <div>
          <p class="eyebrow">Local configuration</p>
          <h2 id="settings-title">Studio Desk setup</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-settings" aria-label="Close">×</button>
      </div>
      <div class="dialog__body" id="settings-body"></div>
    </dialog>

    <input id="csv-file" type="file" accept=".csv,text/csv" hidden />
    <script type="module" src="/app.js"></script>
  </body>
</html>
