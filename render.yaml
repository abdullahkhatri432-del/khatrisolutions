services:
  - type: web
    name: khatrisolutions
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist

    # React Router uses real URLs, so unknown paths must serve the app shell.
    # Render serves a real file first, so /assets/* is not affected.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
