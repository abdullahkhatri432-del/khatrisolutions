[build]
  command = "npm run build"
  publish = "dist"

# React Router uses real URLs, so every unknown path must load the app shell.
# Netlify checks real files first, so /assets/* still serves normally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
