<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khatri Solutions — Websites &amp; AI Automation for Growing Businesses</title>
    <meta
      name="description"
      content="Khatri Solutions is an independent studio building professional websites, online stores, web applications and practical AI automation for small businesses and startups."
    />
    <meta name="theme-color" content="#f4efe5" />
    <meta property="og:site_name" content="Khatri Solutions" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khatri Solutions — Websites That Help Your Business Grow" />
    <meta
      property="og:description"
      content="Professional websites, online stores, web applications and practical AI automation, built around your business goals."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="/" />
    <link rel="preload" href="/src/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/fraunces-latin-italic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms: detection happens by scanning built HTML, so these hidden
      mirrors exist only to register the field names. The React forms post to
      these same names via fetch. Keep fields in sync with src/lib/inquiry.js.
    -->
    <form name="project-inquiry" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="text" name="website" />
      <input type="text" name="kind" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="contactMethod" />
      <textarea name="description"></textarea>
      <textarea name="message"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="source" />
      <input type="text" name="businessType" />
      <input type="text" name="pages" />
      <input type="text" name="existingWebsite" />
      <input type="text" name="productCount" />
      <textarea name="commerceNeeds"></textarea>
      <textarea name="appProblem"></textarea>
      <input type="text" name="userRoles" />
      <textarea name="appFeatures"></textarea>
      <textarea name="automationTask"></textarea>
      <input type="text" name="currentTools" />
      <input type="text" name="currentWebsite" />
      <textarea name="improvements"></textarea>
      <textarea name="primaryGoal"></textarea>
    </form>

    <form name="client-review" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="text" name="website" />
      <input type="text" name="kind" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="text" name="projectType" />
      <input type="text" name="rating" />
      <textarea name="quote"></textarea>
      <input type="text" name="permission" />
      <textarea name="message"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="source" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
